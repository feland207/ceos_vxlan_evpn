---
- name: Gather Vxlan1 interface state (JSON)
  arista.eos.eos_command:
    commands: "show interfaces Vxlan1 | json"
  register: vxlan_iface

- name: Assert Vxlan1 line protocol is up
  ansible.builtin.assert:
    that:
      - vxlan_iface.stdout[0].interfaces.Vxlan1.lineProtocolStatus == "up"
    fail_msg: "Vxlan1 line protocol is NOT up on {{ inventory_hostname }}"
    success_msg: "Vxlan1 OK — line protocol up on {{ inventory_hostname }}"

- name: Gather VXLAN VNI table
  arista.eos.eos_command:
    commands: "show vxlan vni"
  register: vxlan_vni_out

- name: Assert VLAN {{ vxlan_vlan }} → VNI {{ vxlan_vni }} mapping present
  ansible.builtin.assert:
    that:
      - "vxlan_vni | string in vxlan_vni_out.stdout[0]"
    fail_msg: "VNI {{ vxlan_vni }} mapping missing on {{ inventory_hostname }}"
    success_msg: "VNI mapping OK: VLAN{{ vxlan_vlan }} → VNI{{ vxlan_vni }} on {{ inventory_hostname }}"

- name: Gather VXLAN static flood VTEP list
  arista.eos.eos_command:
    commands: "show vxlan flood vtep"
  register: flood_vtep_out

- name: Assert each expected flood VTEP peer is present
  ansible.builtin.assert:
    that:
      - item in flood_vtep_out.stdout[0]
    fail_msg: "Flood VTEP {{ item }} NOT found on {{ inventory_hostname }}"
    success_msg: "Flood VTEP {{ item }} confirmed on {{ inventory_hostname }}"
  loop: "{{ flood_vtep_peers }}"
