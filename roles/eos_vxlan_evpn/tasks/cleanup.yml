---
- name: Remove BGP VRF {{ item.vrf }} section
  arista.eos.eos_config:
    parents: "router bgp {{ bgp_asn }}"
    lines:
      - "no vrf {{ item.vrf }}"
  loop: "{{ evpn_l3vnis | default([]) }}"

- name: Remove BGP EVPN VLAN {{ item.vlan }} section
  arista.eos.eos_config:
    parents: "router bgp {{ bgp_asn }}"
    lines:
      - "no vlan {{ item.vlan }}"
  loop: "{{ evpn_l2vnis | default([]) }}"

- name: Remove BGP address-family evpn
  arista.eos.eos_config:
    parents: "router bgp {{ bgp_asn }}"
    lines:
      - "no address-family evpn"

- name: Remove Vxlan1 interface
  arista.eos.eos_config:
    lines:
      - "no interface Vxlan1"

- name: Remove SVI Vlan{{ item.svi_vlan }}
  arista.eos.eos_config:
    lines:
      - "no interface Vlan{{ item.svi_vlan }}"
  loop: "{{ evpn_l3vnis | default([]) }}"

- name: Check virtual-router MAC address is configured
  arista.eos.eos_command:
    commands: "show running-config | include ip virtual-router mac-address"
  register: vrmac_check
  when: evpn_l3vnis | default([]) | length > 0

- name: Remove virtual-router MAC address
  arista.eos.eos_config:
    lines:
      - "no ip virtual-router mac-address {{ virtual_router_mac }}"
  when:
    - evpn_l3vnis | default([]) | length > 0
    - vrmac_check.stdout[0] | default('') | length > 0
