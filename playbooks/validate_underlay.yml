---
- name: Validate IS-IS underlay and BGP EVPN base
  hosts: ceos
  connection: ansible.netcommon.network_cli
  gather_facts: no

  vars_files:
    - ../secrets.yml
  vars:
    ansible_user: "{{ eos_ansible_user }}"
    ansible_password: "{{ eos_ansible_password }}"

  roles:
    - validate_underlay
