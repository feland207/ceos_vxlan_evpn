[iosxr]
R1 ansible_host=172.60.60.10
R3 ansible_host=172.50.50.30
R5 ansible_host=172.60.60.50
[iosxe]
R2 ansible_host=172.50.50.20
R4 ansible_host=172.60.60.40
R6 ansible_host=172.60.60.60

[ceos]
spine1 ansible_host=172.60.60.21
spine2 ansible_host=172.60.60.22
leaf1  ansible_host=172.60.60.11
leaf2  ansible_host=172.60.60.12
leaf3  ansible_host=172.60.60.13
leaf4  ansible_host=172.60.60.14
leaf5  ansible_host=172.60.60.15

[all:vars]
; ansible_connection=netconf                            # Global for every play

[iosxe:vars]
# Used for cisco.ios collection (IOS XE)
ansible_network_os=cisco.ios.ios

[iosxr:vars]
# Used for cisco.iosxr collection (IOS XR)
ansible_network_os=cisco.iosxr.iosxr

[ceos:vars]
# Used for arista.eos collection (cEOS / EOS)
ansible_become=yes
ansible_become_method=enable
ansible_network_os=arista.eos.eos
# cEOS admin has no enable secret by default in this lab, so no
# ansible_become_password is needed. If you add an enable password
# later, set it here (or in secrets.yml) as ansible_become_password.
