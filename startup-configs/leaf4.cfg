! Command: show running-config
! device: leaf4 (cEOSLab, EOS-4.32.10M-46429116.43210M (engineering build))
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$msveejPAVfqr8qA1$Egz5kyU9O3oJFR7i7JmUabRVHVHLG7rW3QVzUvydwr27Uy6TtN1G1sPLYiF8sgwa8cIQrxy3.m0fBC0BVS615/
!
management api http-commands
   no shutdown
   !
   vrf MGMT
      no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf4
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
clock timezone Europe/Warsaw
!
vlan 10
   name TENANT_A_WEB
!
vrf instance MGMT
!
management api gnmi
   transport grpc default
      vrf MGMT
!
management api netconf
   transport ssh default
      vrf MGMT
!
interface Ethernet1
   description "link-to-spine1"
   no switchport
   ip address 10.1.4.2/30
   isis enable UNDERLAY
   isis network point-to-point
!
interface Ethernet2
   description "link-to-spine2"
   no switchport
   ip address 10.2.4.2/30
   isis enable UNDERLAY
   isis network point-to-point
!
interface Ethernet3
   description link-to-host3
   switchport access vlan 10
!
interface Loopback0
   ip address 10.0.0.14/32
   isis enable UNDERLAY
   isis passive
!
interface Management0
   vrf MGMT
   ip address 172.60.60.14/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
!
mac address-table aging-time 120
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 172.60.60.1
!
router bgp 65000
   router-id 10.0.0.14
   no bgp default ipv4-unicast
   neighbor SPINES peer group
   neighbor SPINES remote-as 65000
   neighbor SPINES update-source Loopback0
   neighbor SPINES send-community extended
   neighbor 10.0.0.21 peer group SPINES
   neighbor 10.0.0.22 peer group SPINES
   !
   vlan 10
      rd 10.0.0.14:10
      route-target both 10:10
      redistribute learned
   !
   address-family evpn
      neighbor SPINES activate
!
router isis UNDERLAY
   net 49.0001.0000.0000.0014.00
   is-type level-2
   log-adjacency-changes
   !
   address-family ipv4 unicast
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
end